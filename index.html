<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบประเมินสุขภาพ ปิงปองจราจรชีวิต 7 สี</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius: 16px;
    }

    * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 24px 16px; min-height: 100vh; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 650px; margin: 0 auto; }
    .app-header { text-align: center; margin-bottom: 24px; }
    .app-header h1 { font-size: 24px; font-weight: 700; color: #1e3a8a; margin: 0 0 6px 0; }
    .app-header p { color: var(--text-muted); font-size: 14px; margin: 0; }
    .card { background: var(--card-bg); border-radius: var(--radius); padding: 24px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); border: 1px solid var(--border-color); margin-bottom: 20px; }
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .btn { background: var(--primary-color); color: white; border: none; padding: 14px 20px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
    .btn:hover { background: var(--primary-hover); }
    .btn-sec { background: #e2e8f0; color: #334155; }
    .btn-speaker { background: #7c3aed; color: white; font-size: 18px; padding: 16px; margin-top: 12px; }
    .form-stack { display: flex; flex-direction: column; gap: 14px; margin-bottom: 16px; }
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-group label { font-size: 15px; font-weight: 600; color: #1e293b; }
    .field-group input { padding: 12px 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 16px; }
    
    #resultBox { display: none; padding: 20px; border-radius: 12px; margin-top: 20px; }
    
    /* สไตล์สีปิงปอง 7 สี */
    .z-white  { background: #ffffff; border: 2px solid #cbd5e1; color: #1e293b; }
    .z-lgreen { background: #f0fdf4; border: 2px solid #86efac; color: #166534; }
    .z-green  { background: #dcfce7; border: 2px solid #4ade80; color: #14532d; }
    .z-yellow { background: #fefce8; border: 2px solid #fde047; color: #854d0e; }
    .z-orange { background: #fff7ed; border: 2px solid #fdba74; color: #9a3412; }
    .z-red    { background: #fef2f2; border: 2px solid #fca5a5; color: #991b1b; }
    .z-black  { background: #0f172a; border: 2px solid #020617; color: #ffffff; }

    #resBadge { font-size: 18px; font-weight: 700; margin: 0 0 8px 0; }
    #resVal { font-size: 16px; margin-bottom: 12px; font-weight: 600; }
    .advice-container { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .advice-item { background: rgba(255, 255, 255, 0.7); padding: 10px 12px; border-radius: 8px; font-size: 14px; }
    .z-black .advice-item { background: rgba(255, 255, 255, 0.15); color: #ffffff; }
  </style>
</head>
<body>

  <div class="container">
    <div class="app-header">
      <h1>🏥 ระบบประเมินสุขภาพ ปิงปอง 7 สี</h1>
      <p>คัดกรองความดันโลหิตและระดับน้ำตาล พร้อมบันทึกผลออนไลน์</p>
    </div>

    <!-- หน้าเมนูหลัก -->
    <div id="screenMenu" class="card">
      <h2 style="margin-top:0; font-size: 18px; text-align: center;">เลือกรายการที่ต้องการประเมิน</h2>
      <div class="menu-grid">
        <button class="btn" onclick="openMode('BP')">🩸 ตรวจความดันโลหิต</button>
        <button class="btn" onclick="openMode('SUGAR')">🍬 ตรวจระดับน้ำตาล</button>
      </div>
    </div>

    <!-- หน้าฟอร์มประเมิน -->
    <div id="screenApp" class="card" style="display: none;">
      <button class="btn btn-sec" onclick="goHome()" style="width: auto; padding: 6px 14px; margin-bottom: 16px;">← เมนูหลัก</button>
      <h2 id="modeTitle" style="margin: 0 0 4px 0; font-size: 20px;">—</h2>
      <p id="modeSubtitle" style="color: var(--text-muted); margin: 0 0 20px 0; font-size: 14px;">—</p>

      <!-- ส่วนติดตามผลสำหรับแอดมิน -->
      <div style="background: #eff6ff; padding: 12px; border-radius: 10px; margin-bottom: 16px; border: 1px solid #bfdbfe;">
        <strong style="color: #1e40af; font-size: 14px;">📌 ข้อมูลติดตามผล (สำหรับแอดมิน/ผู้ดูแล)</strong>
        <div style="display: flex; gap: 10px; margin-top: 8px;">
          <input type="text" id="patientId" placeholder="รหัสคนไข้ (เช่น P001)" style="flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1;">
          <input type="text" id="adminId" placeholder="รหัสผู้ดูแล (ไม่บังคับ)" style="flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1;">
        </div>
      </div>

      <div id="inputForm" class="form-stack"></div>

      <div style="display: flex; gap: 10px; margin-top: 16px;">
        <button class="btn" style="flex: 2;" onclick="submitEvaluation()">ประเมินและบันทึกผล</button>
        <button class="btn btn-sec" style="flex: 1;" onclick="clearInputs()">ล้างค่า</button>
      </div>

      <div id="resultBox">
        <div id="resBadge">—</div>
        <div id="resVal"></div>
        <button class="btn btn-speaker" onclick="playCurrentVoice()">🔊 กดฟังเสียงบอกระดับสุขภาพ</button>
        <hr style="border: 0; border-top: 1px solid rgba(0,0,0,0.1); margin: 16px 0 12px 0;">
        <strong style="font-size: 15px;">💡 ข้อแนะนำตามหลัก 3อ. 3ลด:</strong>
        <div id="resAdvice" class="advice-container"></div>
        <button class="btn btn-speaker" onclick="speak3OAdvice()" style="margin-top: 10px; background-color: #059669;">🔊 กดฟังคำแนะนำหลัก 3อ.</button>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ นำ URL จาก Google Apps Script มาวางแทนที่ข้อความข้างล่างนี้
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyhdH5gl_EoR6GHP0MPFuyypElwqR8IyQMcvap94y1OjG-LX7Sp7ve9cisCHJJ4cfVH/exec";

    let currentMode = '';
    let lastVoiceText = '';

    function openMode(mode) {
      currentMode = mode;
      document.getElementById('screenMenu').style.display = 'none';
      document.getElementById('screenApp').style.display = 'block';
      document.getElementById('resultBox').style.display = 'none';

      const form = document.getElementById('inputForm');
      if (mode === 'BP') {
        document.getElementById('modeTitle').innerText = 'ตรวจความดันโลหิต';
        document.getElementById('modeSubtitle').innerText = 'ระบุค่าความดันโลหิตตัวบนและตัวล่าง (mmHg)';
        form.innerHTML = `
          <div class="field-group"><label>ค่าตัวบน (SYS)</label><input type="number" id="sysVal" placeholder="เช่น 120"></div>
          <div class="field-group"><label>ค่าตัวล่าง (DIA)</label><input type="number" id="diaVal" placeholder="เช่น 80"></div>
        `;
      } else {
        document.getElementById('modeTitle').innerText = 'ตรวจระดับน้ำตาลในเลือด';
        document.getElementById('modeSubtitle').innerText = 'ระบุระดับน้ำตาลหลังงดอาหาร (mg/dL)';
        form.innerHTML = `
          <div class="field-group"><label>ระดับน้ำตาล (FBS)</label><input type="number" id="fbsVal" placeholder="เช่น 95"></div>
        `;
      }
    }

    function goHome() {
      document.getElementById('screenApp').style.display = 'none';
      document.getElementById('screenMenu').style.display = 'block';
      clearInputs();
    }

    function clearInputs() {
      ['sysVal', 'diaVal', 'fbsVal'].forEach(id => { if(document.getElementById(id)) document.getElementById(id).value = ''; });
      document.getElementById('resultBox').style.display = 'none';
    }

    function submitEvaluation() {
      const patientId = document.getElementById('patientId').value.trim();
      const adminId = document.getElementById('adminId').value.trim();

      if (!patientId) {
        alert('กรุณากรอก "รหัสคนไข้" เพื่อเก็บบันทึกประวัติการติดตามผล');
        return;
      }

      let result = null;
      let textVal = '';
      let typeName = '';

      if (currentMode === 'BP') {
        const sys = parseInt(document.getElementById('sysVal')?.value) || 0;
        const dia = parseInt(document.getElementById('diaVal')?.value) || 0;
        if (!sys || !dia) { alert('กรุณากรอกค่าความดันโลหิตให้ครบถ้วน'); return; }
        result = evalBP(sys, dia);
        textVal = `${sys}/${dia} mmHg`;
        typeName = 'ความดันโลหิต';
      } else {
        const fbs = parseInt(document.getElementById('fbsVal')?.value) || 0;
        if (!fbs) { alert('กรุณากรอกระดับน้ำตาล'); return; }
        result = evalSugar(fbs);
        textVal = `${fbs} mg/dL`;
        typeName = 'น้ำตาลในเลือด';
      }

      // แสดงผลบนหน้าจอ
      const box = document.getElementById('resultBox');
      box.className = result.cssClass;
      box.style.display = 'block';
      document.getElementById('resBadge').innerText = result.title;
      document.getElementById('resVal').innerText = `ค่าที่ตรวจได้: ${textVal}`;

      const advBox = document.getElementById('resAdvice');
      advBox.innerHTML = '';
      result.advice.forEach(txt => {
        const div = document.createElement('div');
        div.className = 'advice-item';
        div.innerHTML = txt;
        advBox.appendChild(div);
      });

      // ตั้งค่าเสียงพูด (ความเร็ว 0.85)
      lastVoiceText = `ผลการตรวจ${typeName} อยู่ในระดับ ${result.title.replace(/⚪|🟢|🟡|🟠|🔴|⚫/g, '')}`;
      speakText(lastVoiceText);

      // บันทึกไป Google Sheets
      if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL !== "ใส่_URL_GOOGLE_SCRIPT_ตรงนี้") {
        fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            patientId: patientId,
            adminId: adminId || 'ทั่วไป',
            type: typeName,
            valText: textVal,
            title: result.title
          })
        }).then(() => {
          console.log('ส่งข้อมูลบันทึกลง Google Sheets เรียบร้อย');
        });
      }
    }

    // ฟังก์ชันเสียงพูดอัตราเร็ว 0.85 สำหรับผู้สูงอายุ
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'th-TH';
        utterance.rate = 0.85; 
        window.speechSynthesis.speak(utterance);
      }
    }

    function playCurrentVoice() { if (lastVoiceText) speakText(lastVoiceText); }

    // -------------------------------------------------------------
    // เกณฑ์ประเมินปิงปอง 7 สี แบบครบถ้วนตามหลักสาสุข
    // -------------------------------------------------------------

    function evalBP(sys, dia) {
      if (sys >= 180 || dia >= 110) {
        return {
          cssClass: 'z-black',
          title: '⚫ สีดำ : ภาวะแทรกซ้อน/วิกฤต',
          advice: ['🚨 เสี่ยงอันตรายสูง ควรพบแพทย์ทันที', '3อ: อารมณ์ผ่อนคลาย อย่าวิตกกังวล', '3ลด: ลดกิจกรรมหนัก พักผ่อนทันที']
        };
      } else if (sys >= 160 || dia >= 100) {
        return {
          cssClass: 'z-red',
          title: '🔴 สีแดง : ความดันสูงระดับ 2 (อันตราย)',
          advice: ['ควรพบแพทย์เพื่อรับยาและตรวจอย่างสม่ำเสมอ', '3อ: อาหารรสจืด ออกกำลังกายเบาๆ', '3ลด: ลดเค็ม ลดมัน ลดความเครียด']
        };
      } else if (sys >= 140 || dia >= 90) {
        return {
          cssClass: 'z-orange',
          title: '🟠 สีส้ม : ความดันสูงระดับ 1 (เสี่ยงสูง)',
          advice: ['ทานยาตามแพทย์สั่งอย่างเคร่งครัด', '3อ: ออกกำลังกายแอโรบิก 30 นาที/วัน', '3ลด: ลดอาหารเค็มจัด ลดการดื่มสุรา']
        };
      } else if (sys >= 130 || dia >= 85) {
        return {
          cssClass: 'z-yellow',
          title: '🟡 สีเหลือง : เสี่ยงความดันสูง (ปานกลาง)',
          advice: ['ปรับเปลี่ยนพฤติกรรมเพื่อป้องกันโรค', '3อ: กินผักผลไม้สด อารมณ์แจ่มใส', '3ลด: ลดเค็ม ลดหวาน ลดน้ำหนัก']
        };
      } else if (sys >= 120 || dia >= 80) {
        return {
          cssClass: 'z-green',
          title: '🟢 สีเขียวเข้ม : ปกติมีเสี่ยง (เฝ้าระวัง)',
          advice: ['เฝ้าระวังและตรวจความดันเดือนละครั้ง', '3อ: อาหารครบ 5 หมู่ ออกกำลังกายสม่ำเสมอ', '3ลด: ลดการกินจังค์ฟู้ด']
        };
      } else if (sys >= 100 || dia >= 60) {
        return {
          cssClass: 'z-lgreen',
          title: '🟢 สีเขียวอ่อน : ความดันโลหิตปกติ',
          advice: ['สุขภาพดีเยี่ยม ควบคุมพฤติกรรมเดิมไว้', '3อ: อาหารสุขภาพ ออกกำลังกายสม่ำเสมอ', '3ลด: ลดหวาน มัน เค็ม']
        };
      } else {
        return {
          cssClass: 'z-white',
          title: '⚪ สีขาว : กลุ่มปกติ/เสี่ยงต่ำ',
          advice: ['ตรวจสุขภาพประจำปีอย่างสม่ำเสมอ', '3อ: อารมณ์แจ่มใส อาหารดี มีออกกำลังกาย', '3ลด: ลดปัจจัยเสี่ยงด้านสุขภาพ']
        };
      }
    }

    function evalSugar(fbs) {
      if (fbs >= 183) {
        return {
          cssClass: 'z-black',
          title: '⚫ สีดำ : ระดับน้ำตาลสูงวิกฤต',
          advice: ['🚨 เสี่ยงภาวะแทรกซ้อนสูง ควรพบแพทย์ด่วน', '3อ: อาหารงดแป้งขัดขาวและของหวานเด็ดขาด', '3ลด: ลดหวานให้เป็นศูนย์ พักผ่อนให้พอ']
        };
      } else if (fbs >= 155) {
        return {
          cssClass: 'z-red',
          title: '🔴 สีแดง : ระดับน้ำตาลสูงอันตราย',
          advice: ['ต้องพบแพทย์เพื่อปรับยาและคุมอาหาร', '3อ: ออกกำลังกายเพื่อช่วยดึงน้ำตาลไปใช้', '3ลด: ลดน้ำหวาน ขนมหวาน ข้าวแป้งเยอะ']
        };
      } else if (fbs >= 126) {
        return {
          cssClass: 'z-orange',
          title: '🟠 สีส้ม : เป็นเบาหวาน (เสี่ยงสูง)',
          advice: ['ควบคุมอาหารและรับยาอย่างต่อเนื่อง', '3อ: เน้นผักใบเขียว อาหารกากใยสูง', '3ลด: ลดของหวาน ลดความเครียด']
        };
      } else if (fbs >= 111) {
        return {
          cssClass: 'z-yellow',
          title: '🟡 สีเหลือง : เสี่ยงเบาหวาน (ปานกลาง)',
          advice: ['ปรับพฤติกรรมก่อนกลายเป็นเบาหวาน', '3อ: กินอาหารดัชนีน้ำตาลต่ำ ออกกำลังกาย', '3ลด: ลดน้ำตาล ลดขนมจุบจิบ']
        };
      } else if (fbs >= 100) {
        return {
          cssClass: 'z-green',
          title: '🟢 สีเขียวเข้ม : เริ่มมีเสี่ยงน้ำตาลสูง',
          advice: ['เฝ้าระวังการกินของหวานและแป้ง', '3อ: อาหารธรรมชาติ ไม่ปรุงแต่งเยอะ', '3ลด: ลดน้ำผลไม้ปรุงแต่ง ลดเครื่องดื่มชูกำลัง']
        };
      } else if (fbs >= 70) {
        return {
          cssClass: 'z-lgreen',
          title: '🟢 สีเขียวอ่อน : ระดับน้ำตาลปกติดี',
          advice: ['สุขภาพดีมาก คุมพฤติกรรมนี้ไว้', '3อ: กินอาหารสมดุล อารมณ์ผ่อนคลาย', '3ลด: ลดหวาน มัน เค็ม']
        };
      } else {
        return {
          cssClass: 'z-white',
          title: '⚪ สีขาว : ระดับน้ำตาลปกติ/เสี่ยงต่ำ',
          advice: ['ตรวจสุขภาพและระดับน้ำตาลปีละครั้ง', '3อ: ทานอาหารที่มีประโยชน์สม่ำเสมอ', '3ลด: ลดปัจจัยเสี่ยงต่อสุขภาพ']
        };
      }
    }
    function speak3OAdvice() {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();

    let adviceElement = document.getElementById('resAdvice');
    let adviceText = adviceElement ? adviceElement.innerText : '';

    if (!adviceText.trim()) {
      alert('ไม่พบข้อความคำแนะนำในการอ่าน');
      return;
    }

    let textToSpeak = 'คำแนะนำตามหลัก 3 อ. ' + adviceText;
    let utterance = new SpeechSynthesisUtterance(textToSpeak);
    utterance.lang = 'th-TH';
    utterance.rate = 0.9;

    window.speechSynthesis.speak(utterance);
  } else {
    alert('ขออภัย เบราว์เซอร์นี้ไม่รองรับระบบอ่านออกเสียง');
  }
}
  </script>
</body>
</html>
